name: Build GlitchMic APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Create project files
        run: |
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'GlitchMic'
          include ':app', ':stub'
          EOF_0
          mkdir -p .
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_1
          mkdir -p stub
          cat > stub/build.gradle <<'EOF_2'
          plugins { id 'java-library' }
          java {
              sourceCompatibility = JavaVersion.VERSION_1_8
              targetCompatibility = JavaVersion.VERSION_1_8
          }
          EOF_2
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/IXposedHookLoadPackage.java <<'EOF_3'
          package de.robv.android.xposed;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF_3
          mkdir -p stub/src/main/java/de/robv/android/xposed/callbacks
          cat > stub/src/main/java/de/robv/android/xposed/callbacks/XC_LoadPackage.java <<'EOF_4'
          package de.robv.android.xposed.callbacks;
          public class XC_LoadPackage {
              public static class LoadPackageParam {
                  public String packageName;
                  public String processName;
                  public ClassLoader classLoader;
              }
          }
          EOF_4
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/XC_MethodHook.java <<'EOF_5'
          package de.robv.android.xposed;
          public abstract class XC_MethodHook {
              public XC_MethodHook() {}
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
              public static class MethodHookParam {
                  public Object thisObject;
                  public Object[] args;
                  public Object getResult() { return null; }
                  public void setResult(Object result) {}
              }
              public class Unhook {}
          }
          EOF_5
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/XposedHelpers.java <<'EOF_6'
          package de.robv.android.xposed;
          public class XposedHelpers {
              public static XC_MethodHook.Unhook findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; }
          }
          EOF_6
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/XposedBridge.java <<'EOF_7'
          package de.robv.android.xposed;
          public class XposedBridge {
              public static void log(String text) {}
              public static void log(Throwable t) {}
          }
          EOF_7
          mkdir -p app
          cat > app/build.gradle <<'EOF_8'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.glitch.mic'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.glitch.mic'
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              compileOnly project(':stub')
          }
          EOF_8
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_9'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GlitchMic" android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Glitch voice for microphone input" />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF_9
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/xposed_init <<'EOF_10'
          com.glitch.mic.MainHook
