name: Build GlitchMic APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Create project files
        run: |
          mkdir -p .
          cat > settings.gradle <<'EOF_0'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositories { google(); mavenCentral() }
          }
          rootProject.name = 'GlitchMic'
          include ':app', ':stub'
          EOF_0
          mkdir -p .
          cat > build.gradle <<'EOF_1'
          plugins {
              id 'com.android.application' version '8.2.2' apply false
          }
          EOF_1
          mkdir -p stub
          cat > stub/build.gradle <<'EOF_2'
          plugins { id 'java-library' }
          java {
              sourceCompatibility = JavaVersion.VERSION_1_8
              targetCompatibility = JavaVersion.VERSION_1_8
          }
          EOF_2
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/IXposedHookLoadPackage.java <<'EOF_3'
          package de.robv.android.xposed;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;
          public interface IXposedHookLoadPackage {
              void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) throws Throwable;
          }
          EOF_3
          mkdir -p stub/src/main/java/de/robv/android/xposed/callbacks
          cat > stub/src/main/java/de/robv/android/xposed/callbacks/XC_LoadPackage.java <<'EOF_4'
          package de.robv.android.xposed.callbacks;
          public class XC_LoadPackage {
              public static class LoadPackageParam {
                  public String packageName;
                  public String processName;
                  public ClassLoader classLoader;
              }
          }
          EOF_4
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/XC_MethodHook.java <<'EOF_5'
          package de.robv.android.xposed;
          public abstract class XC_MethodHook {
              public XC_MethodHook() {}
              protected void beforeHookedMethod(MethodHookParam param) throws Throwable {}
              protected void afterHookedMethod(MethodHookParam param) throws Throwable {}
              public static class MethodHookParam {
                  public Object thisObject;
                  public Object[] args;
                  public Object getResult() { return null; }
                  public void setResult(Object result) {}
              }
              public class Unhook {}
          }
          EOF_5
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/XposedHelpers.java <<'EOF_6'
          package de.robv.android.xposed;
          public class XposedHelpers {
              public static XC_MethodHook.Unhook findAndHookMethod(Class<?> clazz, String methodName, Object... parameterTypesAndCallback) { return null; }
          }
          EOF_6
          mkdir -p stub/src/main/java/de/robv/android/xposed
          cat > stub/src/main/java/de/robv/android/xposed/XposedBridge.java <<'EOF_7'
          package de.robv.android.xposed;
          public class XposedBridge {
              public static void log(String text) {}
              public static void log(Throwable t) {}
          }
          EOF_7
          mkdir -p app
          cat > app/build.gradle <<'EOF_8'
          plugins { id 'com.android.application' }
          android {
              namespace 'com.glitch.mic'
              compileSdk 34
              defaultConfig {
                  applicationId 'com.glitch.mic'
                  minSdk 24
                  targetSdk 33
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }
          dependencies {
              compileOnly project(':stub')
          }
          EOF_8
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_9'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="GlitchMic" android:allowBackup="false">
                  <meta-data android:name="xposedmodule" android:value="true" />
                  <meta-data android:name="xposeddescription" android:value="Glitch voice for microphone input" />
                  <meta-data android:name="xposedminversion" android:value="82" />
              </application>
          </manifest>
          EOF_9
          mkdir -p app/src/main/assets
          cat > app/src/main/assets/xposed_init <<'EOF_10'
          com.glitch.mic.MainHook
          EOF_10
          mkdir -p app/src/main/java/com/glitch/mic
          cat > app/src/main/java/com/glitch/mic/GlitchEngine.java <<'EOF_11'
          package com.glitch.mic;

          import java.util.Random;

          /** Простой реалтайм-глитч для PCM16 (interleaved). Работает блок за блоком. */
          public class GlitchEngine {
              // ---- настройки (пресет "Normal Glitch") ----
              static final float GLITCHES_PER_SEC = 1.6f;   // как часто начинается глитч
              static final int   MIN_MS = 90, MAX_MS = 260; // длина глитча
              static final float W_STUTTER = 0.40f, W_REVERSE = 0.20f, W_CHOP = 0.20f, W_PITCH = 0.20f;
              static final float RING_SEC = 1.5f;

              private final Random rnd = new Random();
              private short[] ring = new short[0];
              private int ringPos = 0, filled = 0;
              private int sr = 0, ch = 0;
              private short[] gb = new short[0];
              private int gbPos = 0, gbLen = 0;

              public synchronized void process(short[] a, int off, int n, int sampleRate, int channels) {
                  if (channels < 1) channels = 1;
                  if (sampleRate < 8000) sampleRate = 48000;
                  n -= n % channels;
                  if (n <= 0) return;
                  if (sampleRate != sr || channels != ch) {
                      sr = sampleRate; ch = channels;
                      ring = new short[(int) (RING_SEC * sr) * ch];
                      ringPos = 0; filled = 0; gbPos = 0; gbLen = 0;
                  }
                  // 1) сырой вход -> кольцевой буфер
                  for (int i = 0; i < n; i++) {
                      ring[ringPos] = a[off + i];
                      ringPos = (ringPos + 1) % ring.length;
                  }
                  filled = Math.min(ring.length, filled + n);

                  // 2) решаем, начинать ли глитч
                  int frames = n / ch;
                  if (gbPos >= gbLen && filled > sr / 4 * ch) {
                      float p = GLITCHES_PER_SEC * frames / sr;
                      if (rnd.nextFloat() < p) startGlitch();
                  }
                  // 3) подменяем звук глитчем
                  if (gbPos < gbLen) {
                      int k = Math.min(n, gbLen - gbPos);
                      System.arraycopy(gb, gbPos, a, off, k);
                      gbPos += k;
                  }
              }

              private void startGlitch() {
                  int lenFrames = (MIN_MS + rnd.nextInt(MAX_MS - MIN_MS + 1)) * sr / 1000;
                  float r = rnd.nextFloat();
                  short[] out;
                  if (r < W_STUTTER) {
                      int seg = (30 + rnd.nextInt(90)) * sr / 1000;
                      out = tile(fade(recent(seg)), lenFrames);
                  } else if (r < W_STUTTER + W_REVERSE) {
                      out = reverse(recent(lenFrames));
                  } else if (r < W_STUTTER + W_REVERSE + W_CHOP) {
                      out = chop(recent(lenFrames));
                  } else {
                      double f = rnd.nextBoolean() ? 0.55 + rnd.nextDouble() * 0.25 : 1.3 + rnd.nextDouble() * 0.5;
                      out = resample(recent((int) (lenFrames * f)), f);
                  }
                  out = fade(out);
                  gb = out; gbPos = 0; gbLen = out.length;
              }

              /** последние `frames` кадров, со случайным сдвигом назад */
              private short[] recent(int frames) {
                  int availFrames = filled / ch;
                  frames = Math.max(1, Math.min(frames, availFrames));
                  int maxBack = Math.max(0, availFrames - frames);
                  int back = Math.min(maxBack, rnd.nextInt(Math.max(1, sr / 4)));  // до 250 мс назад
                  int total = frames * ch;
                  short[] out = new short[total];
                  int start = ((ringPos - back * ch - total) % ring.length + ring.length) % ring.length;
                  for (int i = 0; i < total; i++) out[i] = ring[(start + i) % ring.length];
                  return out;
              }

              private short[] fade(short[] x) {
                  int fr = Math.min(sr * 4 / 1000, x.length / ch / 2);
                  short[] y = x.clone();
                  for (int i = 0; i < fr; i++) {
                      float g = (float) i / fr;
                      for (int c = 0; c < ch; c++) {
                          y[i * ch + c] = (short) (y[i * ch + c] * g);
                          int j = y.length - (i + 1) * ch + c;
                          y[j] = (short) (y[j] * g);
                      }
                  }
                  return y;
              }

              private short[] tile(short[] seg, int frames) {
                  short[] out = new short[frames * ch];
                  for (int i = 0; i < out.length; i++) out[i] = seg[i % seg.length];
                  return out;
              }

              private short[] reverse(short[] x) {
                  int fr = x.length / ch;
                  short[] y = new short[x.length];
                  for (int i = 0; i < fr; i++)
                      for (int c = 0; c < ch; c++) y[i * ch + c] = x[(fr - 1 - i) * ch + c];
                  return y;
              }

              private short[] chop(short[] x) {
                  short[] y = x.clone();
                  int fr = y.length / ch;
                  int i = 0; boolean on = true;
                  while (i < fr) {
                      int seg = (15 + rnd.nextInt(30)) * sr / 1000;
                      if (!on) for (int k = i; k < Math.min(fr, i + seg); k++)
                          for (int c = 0; c < ch; c++) y[k * ch + c] = 0;
                      i += seg; on = !on;
                  }
                  return y;
              }

              /** factor > 1 = быстрее/выше, < 1 = медленнее/ниже */
              private short[] resample(short[] x, double factor) {
                  int inFr = x.length / ch;
                  int outFr = Math.max(1, (int) (inFr / factor));
                  short[] y = new short[outFr * ch];
                  for (int i = 0; i < outFr; i++) {
                      double pos = i * factor;
                      int i0 = (int) pos;
                      int i1 = Math.min(inFr - 1, i0 + 1);
                      i0 = Math.min(inFr - 1, i0);
                      double fr = pos - i0;
                      for (int c = 0; c < ch; c++)
                          y[i * ch + c] = (short) (x[i0 * ch + c] * (1 - fr) + x[i1 * ch + c] * fr);
                  }
                  return y;
              }
          }
          EOF_11
          mkdir -p app/src/main/java/com/glitch/mic
          cat > app/src/main/java/com/glitch/mic/MainHook.java <<'EOF_12'
          package com.glitch.mic;

          import android.media.AudioFormat;
          import android.media.AudioRecord;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.nio.ShortBuffer;
          import java.util.WeakHashMap;
          import de.robv.android.xposed.IXposedHookLoadPackage;
          import de.robv.android.xposed.XC_MethodHook;
          import de.robv.android.xposed.XposedBridge;
          import de.robv.android.xposed.XposedHelpers;
          import de.robv.android.xposed.callbacks.XC_LoadPackage;

          /** Перехватывает AudioRecord.read(...) и пропускает звук микрофона через GlitchEngine. */
          public class MainHook implements IXposedHookLoadPackage {

              private static final WeakHashMap<Object, GlitchEngine> ENGINES = new WeakHashMap<>();

              private static GlitchEngine engineFor(Object rec) {
                  synchronized (ENGINES) {
                      GlitchEngine e = ENGINES.get(rec);
                      if (e == null) { e = new GlitchEngine(); ENGINES.put(rec, e); }
                      return e;
                  }
              }

              @Override
              public void handleLoadPackage(XC_LoadPackage.LoadPackageParam lpparam) {
                  Cb cb = new Cb();
                  hook(cb, short[].class, int.class, int.class);
                  hook(cb, short[].class, int.class, int.class, int.class);
                  hook(cb, byte[].class, int.class, int.class);
                  hook(cb, byte[].class, int.class, int.class, int.class);
                  hook(cb, ByteBuffer.class, int.class);
                  hook(cb, ByteBuffer.class, int.class, int.class);
                  XposedBridge.log("GlitchMic: hooks set in " + lpparam.packageName);
              }

              private static void hook(XC_MethodHook cb, Object... types) {
                  Object[] args = new Object[types.length + 1];
                  System.arraycopy(types, 0, args, 0, types.length);
                  args[types.length] = cb;
                  try {
                      XposedHelpers.findAndHookMethod(AudioRecord.class, "read", args);
                  } catch (Throwable t) {
                      XposedBridge.log("GlitchMic: hook failed: " + t);
                  }
              }

              static class Cb extends XC_MethodHook {
                  @Override
                  protected void afterHookedMethod(MethodHookParam p) {
                      try {
                          Object r = p.getResult();
                          if (!(r instanceof Integer)) return;
                          int n = (Integer) r;
                          if (n <= 0) return;
                          AudioRecord rec = (AudioRecord) p.thisObject;
                          if (rec.getAudioFormat() != AudioFormat.ENCODING_PCM_16BIT) return;
                          int sr = rec.getSampleRate();
                          int ch = rec.getChannelCount();
                          GlitchEngine e = engineFor(rec);
                          Object buf = p.args[0];

                          if (buf instanceof short[]) {
                              int off = (Integer) p.args[1];
                              e.process((short[]) buf, off, n, sr, ch);
                          } else if (buf instanceof byte[]) {
                              int off = (Integer) p.args[1];
                              ShortBuffer sb = ByteBuffer.wrap((byte[]) buf, off, n)
                                      .order(ByteOrder.LITTLE_ENDIAN).asShortBuffer();
                              run(sb, n / 2, e, sr, ch);
                          } else if (buf instanceof ByteBuffer) {
                              ByteBuffer bb = ((ByteBuffer) buf).duplicate();
                              bb.limit(bb.position() + n);
                              ShortBuffer sb = bb.slice().order(ByteOrder.LITTLE_ENDIAN).asShortBuffer();
                              run(sb, n / 2, e, sr, ch);
                          }
                      } catch (Throwable t) {
                          XposedBridge.log(t);
                      }
                  }

                  private static void run(ShortBuffer sb, int count, GlitchEngine e, int sr, int ch) {
                      short[] tmp = new short[count];
                      sb.get(tmp);
                      e.process(tmp, 0, count, sr, ch);
                      sb.rewind();
                      sb.put(tmp);
                  }
              }
          }
          EOF_12
      - name: Build
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: GlitchMic-apk
          path: app/build/outputs/apk/debug/app-debug.apk
